name: Evals

run-name: >-
  ${{ github.event_name == 'pull_request' && format('Sweep #{0}', github.event.pull_request.number)
  || inputs.pr && format('Sweep #{0}', inputs.pr)
  || inputs.smoke && 'Smoke run'
  || 'Tier-1 rerun' }}

# Sweeps cost money, so every run stops at the `sweeps` environment until a
# required reviewer approves it. The credentials only exist in that environment.
#
# - A registration pull request (`agent/add-*`) sweeps the experiments it adds
#   and gets the results committed onto its branch.
# - A push to main that changes an eval reruns tier 1 and opens a results pull
#   request.
# - A manual run takes experiment names, a pull request number, or neither for
#   everything tier 1 is missing.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths: [experiments/**]
  push:
    branches: [main]
    paths: [evals/**]
  workflow_dispatch:
    inputs:
      experiments:
        description: Experiment names, space separated. Empty runs what tier 1 is missing
        type: string
      pr:
        description: Pull request to sweep and commit the results to
        type: string
      smoke:
        description: One eval per model to check access. Nothing is committed
        type: boolean
        default: false

permissions: {}

jobs:
  plan:
    name: Plan
    # A registration branch lives in this repository. A fork never gets here.
    if: >-
      github.repository == 'nuxt/nuxt-evals' &&
      (
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'agent/add-')
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      experiments: ${{ steps.plan.outputs.experiments }}
      count: ${{ steps.plan.outputs.count }}
      ref: ${{ steps.target.outputs.ref }}
      sha: ${{ steps.target.outputs.sha }}
      base: ${{ steps.plan.outputs.base }}
      pr: ${{ steps.target.outputs.pr }}
    steps:
      - name: Resolve what to check out
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          if [[ -n "$PR" ]]; then
            [[ "$PR" =~ ^[0-9]+$ ]] || { echo "Not a pull request number: $PR" >&2; exit 1; }
            head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.head.repo.full_name, .head.ref, .head.sha, .state] | @tsv')"
            IFS=$'\t' read -r repo ref sha state <<< "$head"
            [[ "$repo" == "$GITHUB_REPOSITORY" && "$state" == "open" ]] || { echo "#$PR is closed or comes from a fork" >&2; exit 1; }
            printf 'pr=%s\nref=%s\nsha=%s\n' "$PR" "$ref" "$sha" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=main\nsha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Plan the sweep
        id: plan
        env:
          NAMES: ${{ inputs.experiments }}
          PR: ${{ steps.target.outputs.pr }}
          SMOKE: ${{ inputs.smoke && '--smoke' || '' }}
        run: |
          # The commit of main this plan was made against. The sweep runs on
          # it, not on whatever main is once the run is approved.
          echo "base=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          if [[ -n "$PR" ]] && ! git merge-base --is-ancestor origin/main HEAD; then
            # The sweep runs main's evals and the export runs on this branch.
            # Behind main, the two would disagree on the eval set.
            echo "#$PR is behind main. Update the branch, which starts this workflow again." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          if [[ -z "$NAMES" && -n "$PR" ]]; then
            # The experiments this pull request adds.
            NAMES="$(git diff --name-only --diff-filter=A origin/main...HEAD -- 'experiments/*.ts' | sed -E 's#^experiments/(.*)\.ts$#\1#' | tr '\n' ' ')"
            if [[ -z "${NAMES// }" ]]; then
              echo "#$PR adds no experiment. Nothing to run." >> "$GITHUB_STEP_SUMMARY"
              echo "count=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # shellcheck disable=SC2086
          pnpm exec tsx scripts/ci.ts plan $NAMES $SMOKE

  sweep:
    name: Sweep
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: sweeps
    # One sweep at a time: two at once get rate limited on sandbox creation
    # and lose their runs.
    concurrency:
      group: evals-sweep
      cancel-in-progress: false
      # Keep every waiting sweep. By default a new one replaces the one waiting.
      queue: max
    permissions:
      contents: read
    steps:
      # The credentialed step runs main's scripts and dependencies. From a
      # pull request it only takes the experiment files, which `ci.ts sweep`
      # refuses unless they are plain config literals.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Take the experiment files from the pull request
        if: needs.plan.outputs.pr != ''
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          EXPERIMENTS: ${{ needs.plan.outputs.experiments }}
        run: |
          git fetch --depth 1 origin "$SHA"
          for name in $EXPERIMENTS; do
            # Only experiments the pull request adds. One that is already on
            # main has results, and a tier-2 one is never rerun.
            if [[ -e "experiments/$name.ts" ]]; then
              echo "experiments/$name.ts is already on main" >&2
              exit 1
            fi
            git show "$SHA:experiments/$name.ts" > "experiments/$name.ts"
          done

      # The only step that sees the credentials.
      - name: Run the evals
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPERIMENTS: ${{ needs.plan.outputs.experiments }}
          FLAGS: ${{ inputs.smoke && '--smoke' || '' }} ${{ needs.plan.outputs.pr != '' && '--registration' || '' }}
        run: |
          # shellcheck disable=SC2086
          pnpm exec tsx scripts/ci.ts sweep $EXPERIMENTS $FLAGS

      # The export needs the pull request's display name, price and tier, so
      # the rest of the job runs on its tree. The new results are untracked
      # files and stay where they are.
      - name: Switch to the pull request
        if: ${{ !inputs.smoke && needs.plan.outputs.pr != '' }}
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          EXPERIMENTS: ${{ needs.plan.outputs.experiments }}
        run: |
          for name in $EXPERIMENTS; do rm "experiments/$name.ts"; done
          git checkout --detach "$SHA"
          pnpm install --frozen-lockfile

      - name: Export the results
        if: ${{ !inputs.smoke }}
        run: |
          pnpm exec tsx scripts/ci.ts promote
          pnpm run export-results | tee "$RUNNER_TEMP/export.log"
          pnpm run test:cost
          {
            echo '```'
            sed -n '/^Model  /,$p' "$RUNNER_TEMP/export.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only what gets committed leaves the job: .gitignore keeps everything
      # under results/ but summary.json out, transcripts included.
      - name: Collect the changes
        if: ${{ !inputs.smoke }}
        run: |
          git add results agent-results.json scripts/tier-one.ts
          git diff --cached --binary > "$RUNNER_TEMP/results.patch"
          git diff --cached --stat | tail -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.smoke }}
        with:
          name: results
          path: ${{ runner.temp }}/results.patch
          if-no-files-found: error
          retention-days: 3

  commit:
    name: Commit the results
    needs: [plan, sweep]
    if: ${{ !inputs.smoke }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: results
          path: ${{ runner.temp }}

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
          EXPERIMENTS: ${{ needs.plan.outputs.experiments }}
          PR: ${{ needs.plan.outputs.pr }}
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          if [[ ! -s "$RUNNER_TEMP/results.patch" ]]; then
            echo "The sweep produced no new result." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -n "$PR" && "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "#$PR moved while its evals were running. The results are in this run's artifact as a patch against $EXPECTED_SHA." >&2
            exit 1
          fi
          git apply --index --3way "$RUNNER_TEMP/results.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -n "$PR" ]]; then
            git commit -m "chore(results): add ${EXPERIMENTS// /, }"
            git push origin "HEAD:refs/heads/$REF"
          else
            branch="chore/results-$GITHUB_RUN_ID"
            git switch -c "$branch"
            git commit -m "chore(results): rerun tier 1"
            git push origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "chore(results): rerun tier 1" \
              --body "Results of [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), which has the board in its summary."
          fi
